map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream admin_web {
  server admin-web:3000;
}

upstream admin_api {
  server admin-api:9000;
}

upstream mobile_web {
  server mobile-web:5173;
}

upstream mobile_api {
  server mobile-api:9001;
}

upstream admin_swagger {
  server admin-swagger-ui:8080;
}

upstream mobile_swagger {
  server mobile-swagger-ui:8080;
}

# Admin web: http://rezil.nip.io
server {
  listen 80;
  server_name rezil.nip.io;

  location /api/ {
    proxy_pass http://admin_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://admin_web;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# Admin API: http://api.rezil.nip.io
server {
  listen 80;
  server_name api.rezil.nip.io;

  location / {
    proxy_pass http://admin_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

