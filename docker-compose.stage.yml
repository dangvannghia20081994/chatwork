services:
  mysql:
    image: mysql/mysql-server:8.0
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rezil_esms
      MYSQL_USER: rezil
      MYSQL_PASSWORD: pass
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../rezil-esms/etc/docker/env.local/mysql/data:/docker-entrypoint-initdb.d
      - ./etc/mysql/init/02_fix_auth_plugin.sql:/docker-entrypoint-initdb.d/02_fix_auth_plugin.sql:ro
      - ../rezil-esms/etc/docker/env.local/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

  mysql_165:
    image: mysql/mysql-server:8.0
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rezil_esms
      MYSQL_USER: rezil
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-165:/var/lib/mysql
      - ../rezil-esms/etc/docker/env.local/mysql/data:/docker-entrypoint-initdb.d
      - ./etc/mysql/init/02_fix_auth_plugin.sql:/docker-entrypoint-initdb.d/02_fix_auth_plugin.sql:ro
      - ../rezil-esms/etc/docker/env.local/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

  admin-api:
    image: rezil-esms-sbt-lib:local
    build:
      context: ../rezil-esms-lib
      dockerfile: ../rezil-docker/docker/rezil-esms-lib/Dockerfile
      args:
        DEPLOY_ENV: ${DEPLOY_ENV:-}
        REZIL_LIB_VERSION: ${REZIL_LIB_VERSION:-}
    working_dir: /workspace/rezil-esms/be-api
    command: >
      sh -lc "sbt stage
      && target/universal/stage/bin/rezil-esms-admin-api
      -Dhttp.port=9000
      -Dhttp.address=0.0.0.0
      -Drezil.db.mysql.rezil_esms.hostspec.master.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms.hostspec.primary.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms.hostspec.replica.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms_inspection.hostspec.master.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms_inspection.hostspec.primary.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms_inspection.hostspec.replica.hosts=mysql:3306"
    ports:
      - "9000:9000"
    volumes:
      - ../rezil-esms:/workspace/rezil-esms
      - ../rezil-esms-lib:/workspace/rezil-esms-lib:ro
      - sbt-cache:/root/.sbt
      - ivy-cache:/root/.ivy2/cache
      - coursier-cache:/root/.cache/coursier
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true

  mobile-api:
    image: rezil-esms-sbt-lib:local
    build:
      context: ../rezil-esms-lib
      dockerfile: ../rezil-docker/docker/rezil-esms-lib/Dockerfile
      args:
        DEPLOY_ENV: ${DEPLOY_ENV:-}
        REZIL_LIB_VERSION: ${REZIL_LIB_VERSION:-}
    working_dir: /workspace/rezil-esms-mobile/be-api
    command: >
      sh -lc "sbt stage
      && target/universal/stage/bin/rezil-esms-mobile-api
      -Dhttp.port=9001
      -Dhttp.address=0.0.0.0
      -Drezil.db.mysql.rezil_esms.hostspec.master.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms.hostspec.primary.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms.hostspec.replica.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms_inspection.hostspec.master.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms_inspection.hostspec.primary.hosts=mysql:3306
      -Drezil.db.mysql.rezil_esms_inspection.hostspec.replica.hosts=mysql:3306"
    ports:
      - "9001:9001"
    volumes:
      - ../rezil-esms-mobile:/workspace/rezil-esms-mobile
      - ../rezil-esms-lib:/workspace/rezil-esms-lib:ro
      - sbt-cache:/root/.sbt
      - ivy-cache:/root/.ivy2/cache
      - coursier-cache:/root/.cache/coursier
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true

  admin-web:
    image: node:22-alpine
    working_dir: /workspace/rezil-esms/app
    command: >
      sh -lc "npm install --include=dev --legacy-peer-deps
      && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      PUBLIC_API_ENDPOINT: http://rezil.nip.io/api
      PUBLIC_PATH_AUTH: /auth
      PUBLIC_PREFIX_URL: /admin
      PUBLIC_API_TIMEOUT: "120000"
    ports:
      - "3000:3000"
    volumes:
      - ../rezil-esms/app:/workspace/rezil-esms/app
      - admin-node-modules:/workspace/rezil-esms/app/node_modules
    depends_on:
      - admin-api

  mobile-web:
    image: node:22-alpine
    working_dir: /workspace/rezil-esms-mobile/app
    command: >
      sh -lc "npm install --include=dev --legacy-peer-deps --ignore-scripts
      && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://rezil-mobile.nip.io/api/v1
      VITE_ADMIN_SITE_URL: http://rezil.nip.io
    ports:
      - "5173:5173"
    volumes:
      - ../rezil-esms-mobile/app:/workspace/rezil-esms-mobile/app
      - mobile-node-modules:/workspace/rezil-esms-mobile/app/node_modules
    depends_on:
      - mobile-api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "8089:81"
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-web
      - mobile-web
      - admin-api
      - mobile-api
      - admin-swagger-ui
      - mobile-swagger-ui

  admin-openapi-build:
    image: rezil-openapi-build:local
    build:
      context: .
      dockerfile: docker/openapi-build/Dockerfile
    command: sh /workspace/rezil-docker/scripts/admin-openapi-build.sh
    volumes:
      - .:/workspace/rezil-docker:ro
      - ../rezil-esms:/workspace/rezil-esms
      - admin-node-modules:/workspace/rezil-esms/app/node_modules
    restart: "no"

  mobile-openapi-build:
    image: rezil-openapi-build:local
    build:
      context: .
      dockerfile: docker/openapi-build/Dockerfile
    command: sh /workspace/rezil-docker/scripts/mobile-openapi-build.sh
    volumes:
      - .:/workspace/rezil-docker:ro
      - ../rezil-esms-mobile:/workspace/rezil-esms-mobile
      - mobile-node-modules:/workspace/rezil-esms-mobile/app/node_modules
    restart: "no"

  admin-swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /openapi/.openapi.yaml
    volumes:
      - ../rezil-esms/etc/openapi:/openapi:ro
    depends_on:
      admin-openapi-build:
        condition: service_completed_successfully

  mobile-swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /openapi/.openapi.yaml
    volumes:
      - ../rezil-esms-mobile/etc/openapi:/openapi:ro
    depends_on:
      mobile-openapi-build:
        condition: service_completed_successfully

volumes:
  mysql-data:
  mysql-data-165:
  minio-data:
  admin-node-modules:
  mobile-node-modules:
  sbt-cache:
  ivy-cache:
  coursier-cache:
